<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VSL Agent</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 360px;
        margin: 0;
        padding: 16px;
        background: #f8f9fa;
        color: #1a1a1a;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 16px;
        color: #111;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1::before {
        content: '👁';
        font-size: 20px;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 600;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      textarea,
      select,
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        background: #fff;
        transition: border-color 0.15s;
      }
      textarea:focus,
      select:focus,
      input:focus {
        outline: none;
        border-color: #4a90d9;
        box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.15);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      .hint {
        font-size: 11px;
        color: #888;
        margin-top: 2px;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        flex: 1;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }
      #start {
        background: #4a90d9;
        color: #fff;
      }
      #start:hover {
        background: #3a7bc8;
      }
      #start:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #stop {
        background: #e74c3c;
        color: #fff;
      }
      #stop:hover {
        background: #c0392b;
      }
      #stop:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #statusLine {
        margin: 12px 0 4px;
        font-size: 12px;
        font-weight: 600;
        color: #333;
        padding: 6px 10px;
        background: #fff;
        border-radius: 4px;
        border-left: 3px solid #4a90d9;
      }
      #statusLine.running {
        border-left-color: #f39c12;
      }
      #statusLine.done {
        border-left-color: #27ae60;
      }
      #statusLine.error {
        border-left-color: #e74c3c;
      }
      #errorLine {
        margin: 8px 0;
        color: #e74c3c;
        font-size: 12px;
        font-weight: 500;
        min-height: 1em;
      }
      #log {
        margin: 8px 0 0;
        padding: 0 0 0 20px;
        font-size: 11px;
        max-height: 140px;
        overflow-y: auto;
        color: #555;
      }
      #log li {
        margin-bottom: 2px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>VSL Agent</h1>

    <div class="field">
      <label for="goal">Goal</label>
      <textarea id="goal" rows="2" placeholder="What should the agent do on this page?"></textarea>
    </div>

    <div class="field">
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="qwen">Alibaba Qwen</option>
      </select>
    </div>

    <div class="field" id="baseUrlField">
      <label for="baseUrl">API Base URL</label>
      <input id="baseUrl" type="text" placeholder="https://api.openai.com/v1" />
      <div class="hint" id="baseUrlHint">Leave empty for default endpoint</div>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <input id="model" type="text" placeholder="gpt-4o" />
      <div class="hint" id="modelHint">Leave empty for default model</div>
    </div>

    <div class="field">
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
    </div>

    <div class="buttons">
      <button id="start" type="button">▶ Start</button>
      <button id="stop" type="button">■ Stop</button>
    </div>

    <p id="statusLine">Status: idle</p>
    <p id="errorLine"></p>
    <ol id="log"></ol>

    <!-- Собранный бандл (npm run build:extension → extension/dist/popup.global.js). -->
    <script src="dist/popup.global.js"></script>
  </body>
</html>
